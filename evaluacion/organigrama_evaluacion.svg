  <title
     id="title1">Organigrama del sistema de evaluación con fórmulas</title>
  <desc
     id="desc1">Árbol de la evaluación continua (N media de 3 estudios de caso; cada EC = 0,6 Gru + 0,4 Ind; Gru = (0,5 Inf + 0,4 Expo + 0,1 Def) x Co) y del examen final (N = 0,5 Inf + 0,5 Def).</desc>
