     y="386"
     class="crit"
     font-size="11"
     id="text31">En tutoría, tras la corrección del proyecto (≤ 2 semanas).</text>
  <text
     x="632"
     y="416"
     class="tv h"
     font-size="11.5"
     id="text32">Criterios:</text>
  <text
     x="632"
     y="436"
     class="crit"
     font-size="11"
     id="text33">· justificaciones técnicas e interpretación de resultados</text>
  <text
     x="632"
     y="456"
     class="crit"
     font-size="11"
     id="text34">· resolución de las correcciones señaladas en el proyecto</text>
  <text
     x="632"
     y="476"
     class="crit"
     font-size="11"
     id="text35">· reflexión sobre los puntos débiles y recomendaciones dadas</text>
  <text
     x="632"
     y="496"
     class="crit"
     font-size="11"
     id="text36">· proyección de soluciones a nuevos retos del estudio de caso</text>
