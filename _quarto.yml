            href: caso2/caso2_conteos.qmd#sec-u23
          - text: "2.4 · Exceso de ceros"
            href: caso2/caso2_conteos.qmd#sec-u24
          - text: "2.5 · Conteos agrupados"
            href: caso2/caso2_conteos.qmd#sec-u25
          - text: "2.6 · Del conteo al reloj"
            href: caso2/caso2_conteos.qmd#sec-u26
          - text: "2.7 · Selección y regularización"
            href: caso2/caso2_conteos.qmd#sec-u27
          - text: "2.8 · Estudio de caso"
            href: caso2/caso2_conteos.qmd#sec-u28
      - section: "Caso 3 · Continuas positivas"
        href: caso3/caso3_continuas_positivas.qmd
        contents:
          - text: "3.1 · GLM Gamma"
            href: caso3/caso3_continuas_positivas.qmd#sec-u31
