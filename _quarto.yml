project:
  type: website
  output-dir: _site
  # Antes de cada render, invalida la caché `freeze` de un caso si se ha editado
  # cualquiera de sus ficheros (parciales _unidad_*.qmd o scripts R/). Sin esto,
  # `freeze: auto` no detecta cambios en los ficheros INCLUIDOS. Ver el script.
  pre-render: _scripts/invalidar_freeze.R
  render:
    - index.qmd
    - entregas.qmd
    - caso1/caso1_binaria.qmd
    - caso2/caso2_conteos.qmd
    - caso3/caso3_continuas_positivas.qmd
    - referencias.qmd

website:
  title: "GLM con R"
  site-url: "https://asunmayoral.github.io/GLM/"
  description: "Curso de Modelos Lineales Generalizados · Grado en Ciencia de Datos e IA · UMH"
  reader-mode: true
  page-navigation: true          # «anterior / siguiente» al pie de cada página

  navbar:
    background: primary
    search: true
    left:
      - href: index.qmd
        text: Inicio
      - text: "Casos"
        menu:
          - href: caso1/caso1_binaria.qmd
            text: "Caso 1 · ¿Ocurre el evento?"
          - href: caso2/caso2_conteos.qmd
            text: "Caso 2 · ¿Cuántas veces y a qué ritmo?"
          - href: caso3/caso3_continuas_positivas.qmd
            text: "Caso 3 · ¿Cuánto y hasta cuándo?"
      - text: "Recursos"
        menu:
          - href: entregas.qmd
            text: "Entregas y seguimiento"
          - text: "Plantillas"
            href: https://github.com/asunmayoral/GLM/tree/master/evaluacion/plantillas
          - text: "Rúbricas de evaluación"
            href: https://github.com/asunmayoral/GLM/tree/master/evaluacion/Rubricas_evaluacion.xlsx
          - text: "Datos proyecto 1-equipos"
            href: https://github.com/asunmayoral/GLM/tree/master/caso1/datos_equipos
          - text: "Datos proyecto 2-3"
            href: https://github.com/asunmayoral/GLM/tree/master/caso2/datos_equipos_auto
