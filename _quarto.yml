  page-footer:
    border: true
    left: |
      **Modelos Lineales Generalizados con R** · A. M. Mayoral<br>
      Grado en Ciencia de Datos e Inteligencia Artificial
    center: |
      Universidad Miguel Hernández de Elche
    right: |
      [Repositorio del curso](https://github.com/asunmayoral/GLM)<br>
      Material docente abierto

format:
  html:
    theme: [simplex, theme.scss]
    # Tipografía: se carga aquí con <link> (más fiable que un @import en el SCSS)
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link rel="stylesheet"
                href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
    toc: true
    toc-depth: 3
    toc-title: "En esta página"
    back-to-top-navigation: true   # opción de FORMATO, no de `website:`
    code-fold: show      # código visible pero plegable: los estudiantes lo leen y copian
    code-tools:
      source: false # quita "View source"; no se expone el qmd
      toggle: true # mantiene show all/hide all code
    code-copy: true
    df-print: paged
    embed-resources: false
    lightbox: true       # las figuras se amplían al hacer clic

execute:
  freeze: auto  # sólo renderiza los ficheros que han cambiado (si los detecta)

lang: es
